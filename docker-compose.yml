version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Variables will be loaded automatically from .env file via env_file directive
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env

  worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customer_support
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customer_support"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
